# Wi-Fi for HMX units with the radio-equipped processor module (hMOD0013).
# Only merged when MACHINE_FEATURES contains "wifi" (imx8mp-var-dart-hmx1-wifi machine).
#
# DART-MX8M-PLUS (IW612 on usdhc1): out-of-tree moal/mlan driver from
# kernel-module-nxp-wlan. It is a FullMAC driver and only needs cfg80211 (+ WEXT
# for wireless-tools).
# DART-MX8M-PLUS 1.x (BCM43xx on usdhc1): in-tree brcmfmac.

CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_CFG80211_WEXT=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
