# Drop Variscite SOM defaults that HMX does not use:
# - imx-kobs (raw NAND boot tool, HMX boots from eMMC/SD)
# - u-boot-splash (no display)
MACHINE_EXTRA_RDEPENDS:remove = " \
    imx-kobs \
    u-boot-splash \
"

# - VPU and audio (SOF, EASRC, XCVR) firmware: no video or audio on HMX
# - FreeRTOS/Zephyr demo binaries and rproc scripts: U-Boot loads the HMX M7 watchdog firmware itself
MACHINE_FIRMWARE:remove = " \
    firmware-imx-vpu-imx8 \
    firmware-sof-imx \
    sof-zephyr \
    firmware-imx-easrc-imx8mn \
    firmware-imx-xcvr-imx8mp \
    zephyr-demo-imx \
    freertos-variscite-dbg \
    freertos-variscite-scripts \
"
MACHINE_EXTRA_RRECOMMENDS:remove = "imx-alsa-plugins"

BBMASK += "\
    meta-hostmobility-bsp/recipes-bsp/libubootenv \
    meta-variscite-bsp-imx/recipes-multimedia/gstreamer \
"

IMAGE_INSTALL:remove = " \
    packagegroup-security-tpm2 \
    packagegroup-variscite-devel \
"

PREFERRED_CONNECTIVITY_MANAGER_PACKAGES = ""
IMAGE_INSTALL:append = " \
    packagegroup-host-monitor-commercial \
"

MACHINE_EXTRA_RDEPENDS:append = " \
    ${@bb.utils.contains('MACHINE_FEATURES', 'alsa', \
                          'alsa-utils', '', d)} \
    host-poweroff \
    host-watchdog-fw \
    host-watchdog-driver \
"

# Add wic.gz file type support to enable flashing using gzwrite in uboot
IMAGE_FSTYPES:append = " wic.gz"