# Bluetooth for HMX units with the radio-equipped processor module (hMOD0013).
# Only merged when MACHINE_FEATURES contains "bluetooth" (imx8mp-var-dart-hmx1-wifi machine).
#
# DART-MX8M-PLUS (IW612): btnxpuart, bound by the nxp,88w8987-bt node on uart4.
# DART-MX8M-PLUS 1.x (BCM43xx): attached from userspace by bcm43xx-utils through
# the HCI UART line discipline.

CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
# CONFIG_BT_DEBUGFS is not set
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=m
CONFIG_BT_NXPUART=m
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_BCM=y
