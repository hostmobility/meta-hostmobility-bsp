# The HMX board is using a Variscite IMX8MP dart SOM

require conf/machine/imx8mp-var-dart.conf
require conf/machine/include/hmx-base.conf

MACHINEOVERRIDES_EXTENDER:imx8mp-var-dart-hmx1 = "imx8mp-var-dart"

# No radio on the base HMX, use imx8mp-var-dart-hmx1-wifi for hMOD0013
MACHINE_FEATURES = "usbgadget usbhost vfat pci rtc quectel_modem"

# variscite-tpm.inc appends tpm2, but HMX has no TPM (the SE050 is used from userspace)
MACHINE_FEATURES:remove = "tpm2"

KERNEL_DEVICETREE = " \
	freescale/imx8mp-var-dart-hmx1.dtb \
	freescale/imx8mp-var-dart-1.x-hmx1.dtb \
"

# Added unconditionally by variscite_bcm43xx.inc and variscite.inc, only kept with a radio
MACHINE_EXTRA_RDEPENDS:remove = "${@bb.utils.contains('MACHINE_FEATURES', 'wifi', '', \
    'bcm43xx-utils brcm-patchram-plus linux-firmware-bcm4339 linux-firmware-bcm43430', d)}"
IMAGE_INSTALL:remove = "${@bb.utils.contains('MACHINE_FEATURES', 'bluetooth', '', 'packagegroup-tools-bluetooth', d)}"
