# HMX with the radio-equipped processor module (hMOD0013, part number
# HM010-xxxx2): imx8mp-var-dart-hmx1 plus Wi-Fi and Bluetooth. This gives:
# - the kernel fragments wifi.cfg and bluetooth.cfg (linux-variscite_6.6.bbappend)
# - IW612 firmware, kernel-module-nxp-wlan and iw612-utils (imx-base.inc, variscite.inc)
# - wpa-supplicant and bluez5 through packagegroup-base, as the distro enables wifi/bluetooth
# - the Broadcom firmware/tools (DART-MX8M-PLUS 1.x SoMs) and the Variscite Bluetooth tools

# Reuse everything keyed on the imx8mp-var-dart-hmx1 override (kernel, U-Boot, defconfig, ...)
MACHINEOVERRIDES =. "imx8mp-var-dart-hmx1:"

require conf/machine/imx8mp-var-dart-hmx1.conf

MACHINE_FEATURES:append = " wifi bluetooth nxpiw612-sdio"
